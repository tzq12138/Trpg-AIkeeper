<style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f0e8; color: #1a1a1a; }
        h1, h2, h3, .font-headline, .font-display, .font-label { font-family: 'Space Grotesk', sans-serif; }

        .brutal-border { border: 3px solid #1a1a1a; }
        .brutal-shadow { box-shadow: 4px 4px 0px 0px #1a1a1a; }
        .brutal-shadow-hover:hover { box-shadow: 6px 6px 0px 0px #1a1a1a; transform: translate(-2px, -2px); }
        .brutal-shadow-active:active { box-shadow: 0px 0px 0px 0px #1a1a1a; transform: translate(4px, 4px); }
        
        .corkboard-bg {
            background-color: #e8e3da;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Bottom Sheet Transition */
        #item-bottom-sheet {
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
        }
        #item-bottom-sheet.open {

        }

<body class="bg-background min-h-screen flex flex-col pb-24 md:pb-0 overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky border-b-4 border-primary dark:border-primary-fixed shadow-[4px_4px_0px_0px_#1a1a1a] dark:shadow-[4px_4px_0px_0px_#ffcc00] z-40 flex justify-between items-center px-4 py-4 w-full">

</div>
<div class="font-headline font-bold text-sm bg-primary text-surface px-3 py-1 border-2 border-primary">

<main class="flex-grow p-4 md:p-8 flex flex-col gap-8 max-w-4xl mx-auto w-full md:mt-8">

<div class="grid grid-cols-3 md:grid-cols-4 gap-4">

<span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform">flashlight_on</span>
<span class="font-label font-bold text-sm">手电筒</span>
</button>
<!-- Item 2 -->
<button class="brutal-border brutal-shadow brutal-shadow-hover bg-primary-container p-4 flex flex-col items-center justify-center gap-2 aspect-square transition-all group" onclick="openBottomSheet('神秘符咒', 'auto_awesome', '散发着微弱光芒的古老符文。')">
<span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform">auto_awesome</span>

<!-- Item 3 -->

</button>
</div>
</section>
<!-- Investigator Corkboard Section -->

<div class="flex justify-between items-end mb-4 border-b-4 border-primary pb-2">
<h2 class="font-display text-4xl font-black uppercase">Clue Board</h2>
</div>
<div class="corkboard-bg brutal-border brutal-shadow flex-grow relative min-h-[400px] p-6 overflow-hidden">
<!-- Clue Card 1 -->
<div class="absolute top-8 left-4 w-40 bg-surface-container-lowest brutal-border p-3 transform -rotate-3 cursor-pointer hover:rotate-0 hover:scale-105 transition-all shadow-md z-10">
<div class="absolute -top-2 left-1/2 w-4 h-4 bg-secondary rounded-full border-2 border-primary transform -translate-x-1/2 z-20"></div>
<img alt="Doctor Photo" class="w-full h-24 object-cover brutal-border mb-2" data-alt="A neo-brutalist styled grainy photograph of a missing doctor in a stark, high-contrast light mode setting. Thick black outlines, solid color blocks, primarily off-white and black with a subtle red accent. The subject looks concerned in a minimalist environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBE_835fP9NMg8pX_Ce8ekuGBcO8E27L6oHCsUpqGwJ9I0X5bft-czUSucft8RqRQZhxN6QKFZGk6Dx2kmQVlgZ8W-bFugl4AvbVNwyNnZu6uNXN0zX5KagFheTU8asaXc3OKnI1JITSfRFza2ge396AZm_r8xmjwTXxM38VvlYpNjiXwAHMthhDv0VHjTwZeKHpJpJ2UAL1_F8VKeRq0O2xGCnIYS94tH044P0UKa7aA9dHy7XvFo"/>

</div>
<!-- Clue Card 2 -->
<div class="absolute top-24 right-8 w-48 bg-primary-container brutal-border p-3 transform rotate-6 cursor-pointer hover:rotate-0 hover:scale-105 transition-all shadow-md z-20">
<div class="absolute -top-2 left-1/2 w-4 h-4 bg-primary rounded-full border-2 border-primary transform -translate-x-1/2 z-20"></div>
<img alt="Manchester Map" class="w-full h-32 object-cover brutal-border mb-2" data-alt="A highly stylized, geometric map of Manchester rendered in a Bauhaus neo-brutalist aesthetic. High contrast black lines on warm off-white background, harsh angles, solid color fills of primary yellow and black. Minimalist and functional." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDprqsGChdTgjH74OO2teVv5e8nwRNtaBfSIU0WgDq6z_0hNjuH6xgqyCnw7Op4bP6Jp3Y80QI6T11jlfvxH6h3I-qHAEny0hkwAsB5ur-aK_3MWmg-dZghBpB2tlwo_JXzBS-TJNlt0bRhwowigQIZcY_YHDES3rMGoxyx5SVGHi4yjFwwrrdsNNJcMb5egFDiMghB9ScUaKafsK8GQOdnO3mnQsfJfdhoqogxCs6a97n9j_EI2sg"/>

<line stroke="#e63b2e" stroke-dasharray="5,5" stroke-width="3" x1="80" x2="250" y1="120" y2="180"></line>
<line stroke="#1a1a1a" stroke-width="2" x1="140" x2="280" y1="320" y2="200"></line>

<span class="material-symbols-outlined mb-1">explore</span>
<span class="font-label uppercase text-xs font-bold">MAP</span>
</a>
</nav>
<!-- Item Interaction Bottom Sheet -->
<div class="fixed inset-0 bg-primary/50 backdrop-blur-sm z-50 hidden" id="item-bottom-sheet-backdrop" onclick="closeBottomSheet()"></div>
<div class="fixed bottom-0 left-0 w-full bg-surface brutal-border border-b-0 p-6 z-50 md:max-w-md md:left-1/2 md:-translate-x-1/2 md:bottom-24 md:border-b-4 md:shadow-2xl" id="item-bottom-sheet">
<div class="w-12 h-2 bg-primary mx-auto mb-6"></div>
<div class="flex items-start gap-4 mb-8">
<div class="w-16 h-16 bg-primary-container brutal-border flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-3xl" id="bs-icon">category</span>
</div>
<div>
<h3 class="font-headline font-bold text-2xl uppercase mb-1" id="bs-title">Item Name</h3>
<p class="font-body text-sm text-on-surface-variant" id="bs-desc">Description goes here.</p>
</div>
</div>
<div class="flex flex-col gap-3">
<button class="w-full bg-primary text-surface font-headline font-bold uppercase text-lg py-4 brutal-border hover:bg-primary-container hover:text-primary transition-colors brutal-shadow-active">
                尝试使用 (USE)
            </button>
<button class="w-full bg-surface text-primary font-headline font-bold uppercase text-lg py-4 brutal-border hover:bg-surface-container-highest transition-colors brutal-shadow-active">
                展示给队友 (SHOW)
            </button>
</div>
</div>
<script>
        function openBottomSheet(title, icon, desc) {
            document.getElementById('bs-title').innerText = title;
            document.getElementById('bs-icon').innerText = icon;
            document.getElementById('bs-desc').innerText = desc;
            
            document.getElementById('item-bottom-sheet-backdrop').classList.remove('hidden');
            // Small delay to allow display:block to apply before animating transform
            setTimeout(() => {
                document.getElementById('item-bottom-sheet').classList.add('open');
            }, 10);
        }

        function closeBottomSheet() {
            document.getElementById('item-bottom-sheet').classList.remove('open');
            setTimeout(() => {
                document.getElementById('item-bottom-sheet-backdrop').classList.add('hidden');
            }, 300); // match transition duration
        }
    </script>
